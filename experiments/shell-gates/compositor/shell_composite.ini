; shell_composite.ini - read from the folder of shell_composite.dll at load and
; re-read whenever the file changes (live A/B switching). Every key can be
; overridden by an environment variable (VPSHELL_<KEY in upper case>), which wins.
[composite]
; off = no hooks installed | passthrough = hooks installed, nothing drawn | composite
mode=composite
; clear    = after the first ClearRenderTargetView of the back buffer each frame (default)
; nthclear = after the N-th ClearRenderTargetView of ANY render target each frame (see nth)
; omset    = at the first OMSetRenderTargets that binds the back buffer each frame
; present  = just before Present, on top of everything (debug)
insert=clear
nth=1
; AcquireSync(1, timeout_ms): 0 = never wait, draw the previous copy if no new frame
timeout_ms=0
; opaque | alpha (straight alpha from the server's texture)
blend=opaque
; 1 = stop drawing when the server heartbeat is older than stale_ms
hide_when_stale=0
stale_ms=1000
; 1 = ask the server for a texture the size of the back buffer
request_resize=1
stats_ms=1000
; log every clear / OMSetRenderTargets for this many frames after adopting a swap chain
trace_frames=2
section=Local\VPShellSection
; folder for back-buffer dumps (trigger: create an empty shell_composite.shot next to the DLL)
shot_dir=
